  /parcels/weight/max/{max}:
    get:
      tags: [Parcels]
      summary: List parcels by maximum weight
      description: Returns all parcels that weigh at most the given value. Results aren't paginated. To filter with pagination, use `GET /parcels?weightMax=` instead.
      operationId: listParcelsByMaxWeight
      parameters:
        - name: max
          in: path
          required: true
          description: Maximum weight in kilograms.
          schema:
            type: number
            minimum: 0
            example: 2
      responses:
        '200':
          description: A list of matching parcels. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
