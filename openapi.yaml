  /parcels/delivery/{deliveryId}:
    get:
      tags: [Parcels]
      summary: List parcels by delivery
      description: Returns all parcels that belong to the given delivery. Results aren't paginated.
      operationId: listParcelsByDelivery
      parameters:
        - name: deliveryId
