  /parcels/hub/{hubId}:
    get:
      tags: [Parcels]
      summary: List parcels by destination hub
      description: Returns all parcels headed to the given hub. Results aren't paginated.
      operationId: listParcelsByHub
      parameters:
        - name: hubId
          in: path
          required: true
          description: ID of the destination hub.
          schema:
            type: integer
            example: 4
      responses:
        '200':
          description: A list of matching parcels. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /hubs:
    get:
      tags: [Hubs]
      summary: List hubs
      description: Returns a paginated list of hubs. Use the query parameters to filter by city, country, region, or capacity range. Text filters are case-sensitive and must match exactly.
      operationId: listHubs
      parameters:
        - name: page
          in: query
          description: Page number to return.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of hubs per page.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: city
          in: query
          description: Return only hubs in this city, for example `London`.
          schema:
            type: string
        - name: country
          in: query
          description: Return only hubs in this country, for example `UK`.
          schema:
            type: string
        - name: region
          in: query
          description: Return only hubs in this region, for example `Europe`.
          schema:
            type: string
        - name: capacityMin
          in: query
          description: Return only hubs that can hold at least this many parcels.
          schema:
            type: integer
            minimum: 0
        - name: capacityMax
          in: query
          description: Return only hubs that can hold at most this many parcels.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: A page of hubs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Hubs]
      summary: Create a hub
      description: Creates a new hub. Because this is a mock API, the hub isn't saved and the request body isn't validated. The API always returns a success response.
      operationId: createHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hub'
      responses:
        '200':
          description: The hub was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hubs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the hub.
        schema:
          type: integer
          example: 1
    get:
      tags: [Hubs]
      summary: Get a hub
      description: Returns a single hub by its ID. If no hub matches the ID, the API returns an empty object instead of an error.
      operationId: getHub
      responses:
        '200':
          description: The hub, or an empty object if the ID doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Hubs]
      summary: Update a hub
      description: Updates one or more fields of a hub. Include only the fields you want to change. Because this is a mock API, the change isn't saved and the API always returns a success response.
      operationId: updateHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hub'
            example:
              capacity: 200
      responses:
        '200':
          description: The hub was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Hubs]
      summary: Delete a hub
      description: Deletes a hub by its ID. Because this is a mock API, nothing is deleted and the API always returns a success response.
      operationId: deleteHub
      responses:
        '200':
          description: The hub was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hubs/city/{city}:
    get:
      tags: [Hubs]
      summary: List hubs by city
      description: Returns all hubs in the given city. The city name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /hubs?city=` instead.
      operationId: listHubsByCity
      parameters:
        - name: city
          in: path
          required: true
          description: City to filter by.
          schema:
            type: string
            example: London
      responses:
        '200':
          description: A list of matching hubs. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /hubs/country/{country}:
    get:
      tags: [Hubs]
      summary: List hubs by country
      description: Returns all hubs in the given country. The country name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /hubs?country=` instead.
      operationId: listHubsByCountry
      parameters:
        - name: country
          in: path
          required: true
          description: Country to filter by.
          schema:
            type: string
            example: UK
      responses:
        '200':
          description: A list of matching hubs. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /hubs/capacity/min/{min}/max/{max}:
    get:
      tags: [Hubs]
      summary: List hubs in a capacity range
      description: Returns all hubs with a capacity between the minimum and maximum values, including both. Results aren't paginated. To filter with pagination, use `GET /hubs?capacityMin=&capacityMax=` instead.
      operationId: listHubsByCapacityRange
      parameters:
        - name: min
          in: path
          required: true
          description: Minimum capacity, in number of parcels.
          schema:
            type: integer
            minimum: 0
            example: 100
        - name: max
          in: path
          required: true
          description: Maximum capacity, in number of parcels.
          schema:
            type: integer
            minimum: 0
            example: 300
      responses:
        '200':
          description: A list of matching hubs. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /reports/deliveries/status:
    get:
      tags: [Reports]
      summary: Count deliveries by status
      description: Returns the number of deliveries in each status.
      operationId: reportDeliveriesByStatus
      responses:
        '200':
          description: Delivery counts, grouped by status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                    description: Number of pending deliveries.
                    example: 17
                  in_transit:
                    type: integer
                    description: Number of deliveries in transit.
                    example: 17
                  delivered:
                    type: integer
                    description: Number of delivered deliveries.
                    example: 16
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /reports/drivers/vehicle:
    get:
      tags: [Reports]
      summary: Count drivers by vehicle type
      description: Returns the number of drivers who use each vehicle type.
      operationId: reportDriversByVehicle
      responses:
        '200':
          description: Driver counts, grouped by vehicle type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Bike:
                    type: integer
                    description: Number of drivers who use a bike.
                    example: 17
                  Car:
                    type: integer
                    description: Number of drivers who use a car.
                    example: 17
                  Van:
                    type: integer
                    description: Number of drivers who use a van.
                    example: 16
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /reports/parcels/type:
    get:
      tags: [Reports]
      summary: Count parcels by description
      description: Returns the number of parcels for each description.
      operationId: reportParcelsByType
      responses:
        '200':
          description: Parcel counts, grouped by description.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Electronics:
                    type: integer
                    description: Number of parcels containing electronics.
                    example: 17
                  Books:
                    type: integer
                    description: Number of parcels containing books.
                    example: 17
                  Clothes:
                    type: integer
                    description: Number of parcels containing clothes.
                    example: 16
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /reports/hubs/capacity:
    get:
      tags: [Reports]
      summary: List hub capacities
      description: Returns the ID and capacity of every hub.
      operationId: reportHubCapacity
      responses:
        '200':
          description: A list of hubs with their capacities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID of the hub.
                      example: 1
                    capacity:
                      type: integer
                      description: Number of parcels the hub can hold.
                      example: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /assignments/delivery/{deliveryId}/driver/{driverId}:
    post:
      tags: [Assignments]
      summary: Assign a driver to a delivery
      description: Assigns a driver to a delivery. No request body is needed. Because this is a mock API, the assignment isn't saved and the API always returns a success response.
      operationId: assignDriverToDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          description: ID of the delivery.
          schema:
            type: integer
            example: 10
        - name: driverId
          in: path
          required: true
          description: ID of the driver to assign.
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: The driver was assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /assignments/driver/{driverId}:
    get:
      tags: [Assignments]
      summary: List a driver's deliveries
      description: Returns all deliveries assigned to the given driver.
      operationId: listDriverAssignments
      parameters:
        - name: driverId
          in: path
          required: true
          description: ID of the driver.
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: A list of the driver's deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /assignments/hub/{hubId}:
    get:
      tags: [Assignments]
      summary: List a hub's parcels
      description: Returns all parcels headed to the given hub. This returns the same results as `GET /parcels/hub/{hubId}`.
      operationId: listHubAssignments
      parameters:
        - name: hubId
          in: path
          required: true
          description: ID of the hub.
          schema:
            type: integer
            example: 4
      responses:
        '200':
          description: A list of the hub's parcels. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /tracking/delivery/{deliveryId}:
    get:
      tags: [Tracking]
      summary: Track a delivery
      description: Returns the tracking status of a delivery. Because this is a mock API, the status is always `in_transit`, whatever the delivery's actual status is.
      operationId: trackDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          description: ID of the delivery.
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: The delivery's tracking status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveryId:
                    type: string
                    description: ID of the delivery, returned as a string.
                    example: '10'
                  status:
                    type: string
                    description: Tracking status. Always `in_transit`.
                    example: in_transit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /tracking/parcel/{parcelId}:
    get:
      tags: [Tracking]
      summary: Track a parcel
      description: Returns the current location of a parcel. Because this is a mock API, the location is always `Hub 3`, whatever the parcel's actual destination is.
      operationId: trackParcel
      parameters:
        - name: parcelId
          in: path
          required: true
          description: ID of the parcel.
          schema:
            type: integer
            example: 12
      responses:
        '200':
          description: The parcel's current location.
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcelId:
                    type: string
                    description: ID of the parcel, returned as a string.
                    example: '12'
                  location:
                    type: string
                    description: Current location of the parcel. Always `Hub 3`.
                    example: Hub 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    Delivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique ID of the delivery.
          example: 1
        status:
          type: string
          description: Current status of the delivery.
          enum: [pending, in_transit, delivered]
          example: pending
        address:
          type: string
          description: Delivery address.
          example: House 1, Street 10
        customer:
          type: string
          description: Name of the customer receiving the delivery.
          example: Customer 1
        city:
          type: string
          description: City of the delivery address.
          example: London
        country:
          type: string
          description: Country of the delivery address.
          example: UK
        driverId:
          type: integer
          description: ID of the driver assigned to the delivery.
          example: 1
        date:
          type: string
          format: date
          description: Scheduled delivery date, in YYYY-MM-DD format.
          example: '2025-12-01'

    Driver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique ID of the driver.
          example: 1
        name:
          type: string
          description: Driver's name.
          example: Driver 1
        vehicle:
          type: string
          description: Type of vehicle the driver uses.
          enum: [Bike, Car, Van]
          example: Bike
        state:
          type: string
          description: State or region where the driver operates.
          example: California
        country:
          type: string
          description: Country where the driver operates.
          example: USA
        carModel:
          type: string
          description: Make or model of the driver's vehicle.
          example: Trek
        availability:
          type: string
          description: Whether the driver can take new deliveries.
          enum: [available, busy]
          example: available
        experience:
          type: integer
          description: Years of driving experience, from 1 to 15.
          example: 5
        rating:
          type: number
          description: Driver rating, from 0.0 to 5.0. Ratings are randomly generated each time the server restarts.
          example: 4.7

    Parcel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique ID of the parcel.
          example: 1
        weight:
          type: number
          description: Weight of the parcel in kilograms, from 0.0 to 5.0. Weights are randomly generated each time the server restarts.
          example: 2.4
        description:
          type: string
          description: Type of item in the parcel.
          example: Electronics
        destinationHubId:
          type: integer
          description: ID of the hub the parcel is headed to.
          example: 1
        deliveryId:
          type: integer
          description: ID of the delivery the parcel belongs to.
          example: 1

    Hub:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique ID of the hub.
          example: 1
        city:
          type: string
          description: City where the hub is located.
          example: London
        country:
          type: string
          description: Country where the hub is located.
          example: UK
        capacity:
          type: integer
          description: Number of parcels the hub can hold.
          example: 50
        region:
          type: string
          description: Region the hub belongs to.
          example: Europe

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number.
          example: 1
        limit:
          type: integer
          description: Number of results per page.
          example: 10
        total:
          type: integer
          description: Total number of results that match the filters.
          example: 50

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true

    Error:
      type: object
      properties:
        error:
          type: string
          description: A short message explaining what went wrong.
          example: Unauthorized
  
  responses:
    Unauthorized:
      description: The token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    ServerError:
      description: A simulated server error. About 10% of GET requests return this on purpose. Retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Random simulated error
  
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The token returned by `POST /auth/login`.
