openapi: 3.0.3
info:
  title: Delivery API
  version: 1.0.0
  description: |
   The Delivery API is a mock REST API for managing deliveries, drivers, parcels, and hubs. This reference covers every endpoint, parameter, and response.

    New to the API? Start with the [Quickstart](https://chosen-vincent.gitbook.io/delivery-api-docs/get-started/quickstart).
  contact:
    name: Chosen Vincent
    url: https://www.linkedin.com/in/chosenvincent1
servers:
  - url: https://mock-delivery-api.onrender.com
    description: Live server
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Get a token to access the API.
  - name: Deliveries
    description: Create, retrieve, filter, update, and delete deliveries.
  - name: Drivers
    description: Manage drivers and filter them by location, vehicle, availability, experience, or rating.
  - name: Parcels
    description: Manage parcels and filter them by description, weight, delivery, or destination hub.
  - name: Hubs
    description: Manage distribution hubs and filter them by location or capacity.
  - name: Reports
    description: Get summary counts across deliveries, drivers, parcels, and hubs.
  - name: Assignments
    description: Assign drivers to deliveries and view assignments by driver or hub.
  - name: Tracking
    description: Check a delivery's status or a parcel's location.
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a token
      description: Returns a bearer token for accessing the API. Any username and password work, as long as both are included. Every user gets the same token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Any username.
                  example: demo
                password:
                  type: string
                  description: Any password.
                  example: password123
      responses:
        '200':
          description: Login successful. Returns the token to use in the `Authorization` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The bearer token.
                    example: testtoken123
                  user:
                    type: string
                    description: The logged-in user.
                    example: mock-user
        '400':
          description: The username or password is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing username or password

  /deliveries:
    get:
      tags: [Deliveries]
      summary: List deliveries
      description: Returns a paginated list of deliveries. Use the query parameters to filter by status, city, or country. Filters are case-sensitive and must match exactly.
      operationId: listDeliveries
      parameters:
        - name: page
          in: query
          description: Page number to return.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of deliveries per page.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: status
          in: query
          description: Return only deliveries with this status.
          schema:
            type: string
            enum: [pending, in_transit, delivered]
        - name: city
          in: query
          description: Return only deliveries in this city, for example `London`.
          schema:
            type: string
        - name: country
          in: query
          description: Return only deliveries in this country, for example `UK`.
          schema:
            type: string
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Deliveries]
      summary: Create a delivery
      description: Creates a new delivery. Because this is a mock API, the delivery isn't saved and the request body isn't validated. The API always returns a success response.
      operationId: createDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Delivery'
      responses:
        '200':
          description: The delivery was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /deliveries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the delivery.
        schema:
          type: integer
          example: 1
    get:
      tags: [Deliveries]
      summary: Get a delivery
      description: Returns a single delivery by its ID. If no delivery matches the ID, the API returns an empty object instead of an error.
      operationId: getDelivery
      responses:
        '200':
          description: The delivery, or an empty object if the ID doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Deliveries]
      summary: Update a delivery
      description: Updates one or more fields of a delivery. Include only the fields you want to change. Because this is a mock API, the change isn't saved and the API always returns a success response.
      operationId: updateDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Delivery'
            example:
              status: delivered
      responses:
        '200':
          description: The delivery was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Deliveries]
      summary: Delete a delivery
      description: Deletes a delivery by its ID. Because this is a mock API, nothing is deleted and the API always returns a success response.
      operationId: deleteDelivery
      responses:
        '200':
          description: The delivery was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deliveries/status/{status}:
    get:
      tags: [Deliveries]
      summary: List deliveries by status
      description: Returns all deliveries with the given status. Results aren't paginated. To filter with pagination, use `GET /deliveries?status=` instead.
      operationId: listDeliveriesByStatus
      parameters:
        - name: status
          in: path
          required: true
          description: Delivery status to filter by.
          schema:
            type: string
            enum: [pending, in_transit, delivered]
      responses:
        '200':
          description: A list of matching deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /deliveries/city/{city}:
    get:
      tags: [Deliveries]
      summary: List deliveries by city
      description: Returns all deliveries in the given city. The city name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /deliveries?city=` instead.
      operationId: listDeliveriesByCity
      parameters:
        - name: city
          in: path
          required: true
          description: City to filter by.
          schema:
            type: string
            example: London
      responses:
        '200':
          description: A list of matching deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /deliveries/country/{country}:
    get:
      tags: [Deliveries]
      summary: List deliveries by country
      description: Returns all deliveries in the given country. The country name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /deliveries?country=` instead.
      operationId: listDeliveriesByCountry
      parameters:
        - name: country
          in: path
          required: true
          description: Country to filter by.
          schema:
            type: string
            example: UK
      responses:
        '200':
          description: A list of matching deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /deliveries/customer/{customer}:
    get:
      tags: [Deliveries]
      summary: List deliveries by customer
      description: Returns all deliveries for the given customer. The name is case-sensitive and must match exactly. Results aren't paginated.
      operationId: listDeliveriesByCustomer
      parameters:
        - name: customer
          in: path
          required: true
          description: Customer name to filter by.
          schema:
            type: string
            example: Customer 1
      responses:
        '200':
          description: A list of matching deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /deliveries/date/{date}:
    get:
      tags: [Deliveries]
      summary: List deliveries by date
      description: Returns all deliveries scheduled for the given date. Results aren't paginated.
      operationId: listDeliveriesByDate
      parameters:
        - name: date
          in: path
          required: true
          description: Delivery date, in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2025-12-01'
      responses:
        '200':
          description: A list of matching deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /deliveries/range/{start}/{end}:
    get:
      tags: [Deliveries]
      summary: List deliveries in a date range
      description: Returns all deliveries scheduled between two dates, including both the start and end dates. Results aren't paginated.
      operationId: listDeliveriesByDateRange
      parameters:
        - name: start
          in: path
          required: true
          description: First date in the range, in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2025-12-01'
        - name: end
          in: path
          required: true
          description: Last date in the range, in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2025-12-07'
      responses:
        '200':
          description: A list of matching deliveries. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers
      description: Returns a paginated list of drivers. Use the query parameters to filter by vehicle, state, country, or car model. Filters are case-sensitive and must match exactly.
      operationId: listDrivers
      parameters:
        - name: page
          in: query
          description: Page number to return.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of drivers per page.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: vehicle
          in: query
          description: Return only drivers with this vehicle type.
          schema:
            type: string
            enum: [Bike, Car, Van]
        - name: state
          in: query
          description: Return only drivers in this state or region, for example `California`.
          schema:
            type: string
        - name: country
          in: query
          description: Return only drivers in this country, for example `USA`.
          schema:
            type: string
        - name: carModel
          in: query
          description: Return only drivers with this vehicle model, for example `Volvo`.
          schema:
            type: string
      responses:
        '200':
          description: A page of drivers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Drivers]
      summary: Create a driver
      description: Creates a new driver. Because this is a mock API, the driver isn't saved and the request body isn't validated. The API always returns a success response.
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Driver'
      responses:
        '200':
          description: The driver was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /drivers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the driver.
        schema:
          type: integer
          example: 1
    get:
      tags: [Drivers]
      summary: Get a driver
      description: Returns a single driver by their ID. If no driver matches the ID, the API returns an empty object instead of an error.
      operationId: getDriver
      responses:
        '200':
          description: The driver, or an empty object if the ID doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Drivers]
      summary: Update a driver
      description: Updates one or more fields of a driver. Include only the fields you want to change. Because this is a mock API, the change isn't saved and the API always returns a success response.
      operationId: updateDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Driver'
            example:
              availability: busy
      responses:
        '200':
          description: The driver was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Drivers]
      summary: Delete a driver
      description: Deletes a driver by their ID. Because this is a mock API, nothing is deleted and the API always returns a success response.
      operationId: deleteDriver
      responses:
        '200':
          description: The driver was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /drivers/state/{state}:
    get:
      tags: [Drivers]
      summary: List drivers by state
      description: Returns all drivers in the given state or region. The name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /drivers?state=` instead.
      operationId: listDriversByState
      parameters:
        - name: state
          in: path
          required: true
          description: State or region to filter by.
          schema:
            type: string
            example: California
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /drivers/country/{country}:
    get:
      tags: [Drivers]
      summary: List drivers by country
      description: Returns all drivers in the given country. The name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /drivers?country=` instead.
      operationId: listDriversByCountry
      parameters:
        - name: country
          in: path
          required: true
          description: Country to filter by.
          schema:
            type: string
            example: USA
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /drivers/vehicle/{vehicle}:
    get:
      tags: [Drivers]
      summary: List drivers by vehicle type
      description: Returns all drivers who use the given vehicle type. Results aren't paginated. To filter with pagination, use `GET /drivers?vehicle=` instead.
      operationId: listDriversByVehicle
      parameters:
        - name: vehicle
          in: path
          required: true
          description: Vehicle type to filter by.
          schema:
            type: string
            enum: [Bike, Car, Van]
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /drivers/car/{carModel}:
    get:
      tags: [Drivers]
      summary: List drivers by vehicle model
      description: Returns all drivers with the given vehicle model. The model name is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /drivers?carModel=` instead.
      operationId: listDriversByCarModel
      parameters:
        - name: carModel
          in: path
          required: true
          description: Vehicle model to filter by.
          schema:
            type: string
            example: Volvo
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /drivers/availability/{status}:
    get:
      tags: [Drivers]
      summary: List drivers by availability
      description: Returns all drivers with the given availability. Results aren't paginated.
      operationId: listDriversByAvailability
      parameters:
        - name: status
          in: path
          required: true
          description: Availability to filter by.
          schema:
            type: string
            enum: [available, busy]
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /drivers/experience/{years}:
    get:
      tags: [Drivers]
      summary: List drivers by minimum experience
      description: Returns all drivers with at least the given number of years of experience. Results aren't paginated.
      operationId: listDriversByExperience
      parameters:
        - name: years
          in: path
          required: true
          description: Minimum years of experience.
          schema:
            type: integer
            minimum: 1
            example: 5
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /drivers/rating/{min}:
    get:
      tags: [Drivers]
      summary: List drivers by minimum rating
      description: Returns all drivers with a rating equal to or higher than the given value. Results aren't paginated. Ratings are randomly generated each time the server restarts, so results change between restarts.
      operationId: listDriversByRating
      parameters:
        - name: min
          in: path
          required: true
          description: Minimum rating, from 0.0 to 5.0.
          schema:
            type: number
            minimum: 0
            maximum: 5
            example: 4.5
      responses:
        '200':
          description: A list of matching drivers. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /parcels:
    get:
      tags: [Parcels]
      summary: List parcels
      description: Returns a paginated list of parcels. Use the query parameters to filter by description or weight range. The description filter is case-sensitive and must match exactly.
      operationId: listParcels
      parameters:
        - name: page
          in: query
          description: Page number to return.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of parcels per page.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: description
          in: query
          description: Return only parcels with this description, for example `Electronics`.
          schema:
            type: string
        - name: weightMin
          in: query
          description: Return only parcels that weigh at least this many kilograms.
          schema:
            type: number
            minimum: 0
        - name: weightMax
          in: query
          description: Return only parcels that weigh at most this many kilograms.
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: A page of parcels.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Parcels]
      summary: Create a parcel
      description: Creates a new parcel. Because this is a mock API, the parcel isn't saved and the request body isn't validated. The API always returns a success response.
      operationId: createParcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parcel'
      responses:
        '200':
          description: The parcel was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /parcels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the parcel.
        schema:
          type: integer
          example: 1
    get:
      tags: [Parcels]
      summary: Get a parcel
      description: Returns a single parcel by its ID. If no parcel matches the ID, the API returns an empty object instead of an error.
      operationId: getParcel
      responses:
        '200':
          description: The parcel, or an empty object if the ID doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Parcels]
      summary: Update a parcel
      description: Updates one or more fields of a parcel. Include only the fields you want to change. Because this is a mock API, the change isn't saved and the API always returns a success response.
      operationId: updateParcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parcel'
            example:
              destinationHubId: 3
      responses:
        '200':
          description: The parcel was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Parcels]
      summary: Delete a parcel
      description: Deletes a parcel by its ID. Because this is a mock API, nothing is deleted and the API always returns a success response.
      operationId: deleteParcel
      responses:
        '200':
          description: The parcel was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parcels/description/{description}:
    get:
      tags: [Parcels]
      summary: List parcels by description
      description: Returns all parcels with the given description. The description is case-sensitive and must match exactly. Results aren't paginated. To filter with pagination, use `GET /parcels?description=` instead.
      operationId: listParcelsByDescription
      parameters:
        - name: description
          in: path
          required: true
          description: Parcel description to filter by.
          schema:
            type: string
            example: Electronics
      responses:
        '200':
          description: A list of matching parcels. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /parcels/weight/min/{min}/max/{max}:
    get:
      tags: [Parcels]
      summary: List parcels in a weight range
      description: Returns all parcels that weigh between the minimum and maximum values, including both. Results aren't paginated. To filter with pagination, use `GET /parcels?weightMin=&weightMax=` instead.
      operationId: listParcelsByWeightRange
      parameters:
        - name: min
          in: path
          required: true
          description: Minimum weight in kilograms.
          schema:
            type: number
            minimum: 0
            example: 2
        - name: max
          in: path
          required: true
          description: Maximum weight in kilograms.
          schema:
            type: number
            minimum: 0
            example: 4
      responses:
        '200':
          description: A list of matching parcels. Returns an empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /parcels/weight/min/{min}:
    get:
      tags: [Parcels]
      summary: List parcels by minimum weight
      description: Returns all parcels that weigh at least the given value. Results aren't paginated. To filter with pagination, use `GET /parcels?weightMin=` instead.
      operationId: listParcelsByMinWeight
      parameters:
        - name: min
          in: path
          required: true
          description: Minimum weight in kilograms.
          schema:
